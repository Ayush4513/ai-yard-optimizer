services:
  # Backend API (Free Docker Web Service)
  - type: web
    name: yard-optimizer-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DOCKER_ENV
        value: "true"
      - key: CHROMA_USE_DOCKER
        value: "false"
      - key: CHROMA_DB_PATH
        value: "/app/chroma_db"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: "claude-sonnet-4-5-20250929"
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_MODEL
        value: "gemini-2.0-flash"

  # Frontend (Free Static Site)
  - type: web
    name: yard-optimizer-frontend
    runtime: static
    buildCommand: cd Yard-Optimization && npm install && npm run build
    staticPublishPath: ./Yard-Optimization/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://yard-optimizer-api.onrender.com
