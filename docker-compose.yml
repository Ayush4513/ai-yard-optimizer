version: '3.8'

services:
  neo4j:
    image: neo4j:5.14.0
    container_name: container_yard_neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/container_yard_password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "container_yard_password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - container_yard_network

  chromadb:
    image: chromadb/chroma:latest
    container_name: container_yard_chromadb
    ports:
      - "8001:8000"  # ChromaDB API (8001 to avoid conflict with FastAPI on 8000)
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chromadb_data:/chroma/chroma
    networks:
      - container_yard_network
    depends_on:
      - neo4j

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: container_yard_api
    ports:
      - "8000:8000"  # FastAPI
    environment:
      - DOCKER_ENV=true
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=container_yard_password
      - CHROMA_USE_DOCKER=true
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
    volumes:
      - ./data:/app/data  # Rules JSON files
      - ./chroma_db:/app/chroma_db  # Local fallback (if needed)
      - ./.env:/app/.env:ro  # Read-only .env file
    networks:
      - container_yard_network
    depends_on:
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  chromadb_data:

networks:
  container_yard_network:
    driver: bridge

